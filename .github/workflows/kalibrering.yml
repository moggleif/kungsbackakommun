# Kalibreringen av väg H (K84, ADR-0105): väg H mäts på textlagersidor ur
# poolen, med textlagret som facit. Körs för hand och i varje PR som ändrar
# regeln, mätningen, OCR-läsningen eller beroendena, där Dependabot byter
# motor och modell. Faller när en bekräftad sida har ett fel eller när för
# få sidor gick att mäta.
name: Kalibrering av väg H

on:
  workflow_dispatch:
    inputs:
      antal:
        description: Antal sidor
        default: "300"
  pull_request:
    paths:
      - src/kommunhandlingar/konvertering/vag_h.py
      - src/kommunhandlingar/konvertering/radlasning.py
      - src/kommunhandlingar/konvertering/upphojt.py
      - src/kommunhandlingar/konvertering/rapid.py
      - src/kommunhandlingar/konvertering/morka_delar.py
      - src/kommunhandlingar/konvertering/ocr.py
      - src/kommunhandlingar/konvertering/tesseract.py
      - src/kommunhandlingar/konvertering/tsv.py
      - pyproject.toml
      - uv.lock
      - src/kommunhandlingar/kalibrering/**
      - .github/workflows/kalibrering.yml

permissions:
  contents: read

concurrency:
  group: kalibrering-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  kalibrering:
    name: Kalibrering av väg H
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tesseract med svensk modell (OCR, ADR-0005)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-swe
      - uses: ./.github/actions/installera
      - name: Mätningen
        run: python -m kommunhandlingar.kalibrering data kalibrering --antal "${ANTAL:-300}"
        env:
          ANTAL: ${{ inputs.antal }}
      - name: Rapporten i sammanfattningen
        if: always()
        run: cat kalibrering/rapport.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: kalibrering
          path: kalibrering/
