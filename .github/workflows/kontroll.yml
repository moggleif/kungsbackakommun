name: Kontroll

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kontroll:
    name: Ren kod och tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Markdown-lint jämför PR:ens merge-commit med dess första förälder.
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Inga binärer utom små testfixturer (AGENTS.md)
        run: |
          if git ls-files --eol | grep 'i/-text' | grep -v $'\ttests/fixtures/'; then exit 1; fi
          # En PDF med bara text ser ut som text för git (ADR-0115).
          if git ls-files '*.pdf' ':!tests/fixtures/' | grep .; then exit 1; fi
          if find tests/fixtures -type f -size +1M 2>/dev/null | grep .; then exit 1; fi
      - name: Externa actions fästa vid en commit (ADR-0115)
        run: |
          if grep -rnP '^\s*(-\s*)?uses:\s*(?!\./)[^@\s]+@(?![0-9a-f]{40}\b)' .github; then exit 1; fi
      - name: Tesseract med svensk modell (OCR, ADR-0005)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-swe
      - run: pip install -e ".[utveckling]"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Utan paketens installationsskript, som annars körs med jobbets
      # rättigheter (ADR-0115).
      - name: Webbplatsens skript, ESLint och jsdom (K83, ADR-0104)
        run: npm install --no-fund --no-audit --ignore-scripts
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/kontrollera_storlek.py
      - run: npx eslint
      - name: Webbplatsens skript på ögonblicksbildens sidor (K83)
        run: npm test
      - name: Testerna under täckningsmätning (K75, ADR-0102)
        run: coverage run -m unittest discover -s tests -t .
      - name: Täckningen i sammanfattningen, också när ett test fallit
        if: always()
        run: |
          set -o pipefail
          coverage combine -q
          coverage report --format=markdown --sort=cover | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Markdown-lint på ändrade filer (ADR-0021)
        if: github.event_name == 'pull_request'
        # HEAD är PR:ens merge-commit; dess första förälder är basen. En stor
        # fil tar en minut, så filerna delas på fyra processer. Ett `:` först
        # gör namnet till en sökväg och inte ett glob-mönster.
        run: |
          set -o pipefail
          npm install --global --ignore-scripts markdownlint-cli2@0.23.3
          git diff -z --name-only --diff-filter=AMR HEAD^1 HEAD -- '*.md' \
            | sed -z 's/^/:/' | xargs -0 -r -P 4 -n 25 markdownlint-cli2
      - name: Datakontrollerna (K11)
        run: python -m kommunhandlingar.datakontroll data
      - name: Kända sårbarheter i projektets beroenden
        run: pip-audit .
