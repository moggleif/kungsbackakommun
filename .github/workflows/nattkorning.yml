# Den schemalagda körningen (K11, K53, ADR-0006, ADR-0015, ADR-0052, ADR-0061,
# ADR-0077 och ADR-0088): först mötessidorna, upptäckt och steg 2 för varje
# kommun, sedan arkivet (K16, ADR-0018) ovanpå deras gren. Var 15:e minut
# kontrolleras det klara och checkas in. Jobben som läser PDF:erna har bara
# läsrätt och ingen token i utcheckningen; deras commitar går som artefakt
# till PR-jobbet, som pushar jobbets egen gren och öppnar en PR som mergas
# automatiskt, också när jobbet fallit efter en incheckad del; inte när
# körningen avbrutits för hand (K95, ADR-0118).
name: Nattkörning

on:
  schedule:
    - cron: "23 1 * * *"
    # Tills arkivet är ikapp: tas bort när sammanfattningen inte längre har
    # arkivfiler som väntar på nästa körning (ADR-0061).
    - cron: "23 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nattkorning
  cancel-in-progress: false

# `shell: bash` ger `-eo pipefail`; utan den kör Actions `bash -e`, och ett
# fel i steg 2 före `| tee` skulle inte stoppa körningen (K11).
defaults:
  run:
    shell: bash

jobs:
  moten:
    name: Mötessidorna
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      gren: ${{ steps.incheckning.outputs.gren }}
      bas: ${{ steps.incheckning.outputs.bas }}
    steps:
      - name: Jobbets start, som tidsbudgeten räknas från, och dess gren
        run: |
          {
            echo "START=$(date +%s)"
            echo "DEL=moten"
            echo "GREN=nattkorning/$(date -u +%F)-${{ github.run_id }}-${{ github.run_attempt }}-moten"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Utcheckningens commit, som jobbets bundle bygger på
        run: echo "BAS=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tesseract med svensk modell (OCR, ADR-0005)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-swe
      - uses: ./.github/actions/installera
      - name: Mötessidorna, bara det nya och ändrade
        uses: ./.github/actions/levande
        with:
          flaggor: --utan-omkonvertering
      # Delarna checkas in i steg 2; upptäckten skriver inget i data/.
      - id: incheckning
        if: always()
        uses: ./.github/actions/grenen
      - name: Sammanfattning
        if: always()
        run: |
          {
            echo '```'
            tail -n 200 "$RUNNER_TEMP/sammanfattning.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  pr-moten:
    needs: moten
    if: ${{ !cancelled() && needs.moten.outputs.gren != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/nattkorning-pr.yml
    with:
      del: moten
      gren: ${{ needs.moten.outputs.gren }}
      bas: ${{ needs.moten.outputs.bas }}
    secrets:
      NATTKORNING_TOKEN: ${{ secrets.NATTKORNING_TOKEN }}

  # Från mötenas gren, så att arkivets PR inte krockar med deras; utan gren
  # från main. Mötenas gren finns också när jobbet föll efter en incheckad
  # del, och pushas av deras PR-jobb innan arkivet startar (ADR-0077,
  # ADR-0088, ADR-0118).
  arkiv:
    name: Omkonvertering och arkiv
    needs: pr-moten
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      gren: ${{ steps.incheckning.outputs.gren }}
      bas: ${{ steps.incheckning.outputs.bas }}
    steps:
      - name: Jobbets start, som tidsbudgeten räknas från, och dess gren
        run: |
          {
            echo "START=$(date +%s)"
            echo "DEL=arkiv"
            echo "GREN=nattkorning/$(date -u +%F)-${{ github.run_id }}-${{ github.run_attempt }}-arkiv"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pr-moten.outputs.gren || 'main' }}
          persist-credentials: false
      - name: Utcheckningens commit, som jobbets bundle bygger på
        run: echo "BAS=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tesseract med svensk modell (OCR, ADR-0005)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-swe
      - uses: ./.github/actions/installera
      # Upptäckten görs om, eftersom kandidatlistan låg på mötenas runner.
      - name: Omkonverteringen, och det som kommit sedan mötenas jobb
        uses: ./.github/actions/levande
      - name: Arkivet för varje kommun
        # Ett fel i arkivet stoppar inte incheckningen av det levande (ADR-0018).
        continue-on-error: true
        run: |
          for kommunfil in kommuner/*.toml; do
            python -m kommunhandlingar.upptack "$kommunfil" "$RUNNER_TEMP/arbete" \
              --arkiv --start "$START" | tee -a "$RUNNER_TEMP/sammanfattning.txt"
            .github/nattkorning/hamta_i_delar.sh "$kommunfil" --arkiv
          done
      # Arkivets steg får falla utan att stoppa jobbet, så det som hämtats
      # efter dess sista incheckade del checkas in här.
      - name: Det sista som hämtats
        run: .github/nattkorning/spara.sh "Nattkörning $(date -u +%F), $DEL, sist"
      - id: incheckning
        if: always()
        uses: ./.github/actions/grenen
      - name: Sammanfattning
        if: always()
        run: |
          {
            echo '```'
            tail -n 200 "$RUNNER_TEMP/sammanfattning.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  pr-arkiv:
    needs: arkiv
    if: ${{ !cancelled() && needs.arkiv.outputs.gren != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/nattkorning-pr.yml
    with:
      del: arkiv
      gren: ${{ needs.arkiv.outputs.gren }}
      bas: ${{ needs.arkiv.outputs.bas }}
    secrets:
      NATTKORNING_TOKEN: ${{ secrets.NATTKORNING_TOKEN }}
