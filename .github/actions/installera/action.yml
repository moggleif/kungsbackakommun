# Projektets Python-beroenden i de versioner och med de hashar som står i
# uv.lock, också beroendenas egna beroenden (K94, ADR-0117).
name: Låsta beroenden
description: Installerar uv.lock med pip --require-hashes och paketet utan beroenden.
inputs:
  utveckling:
    description: "true tar med ruff, pip-audit och coverage"
    default: "false"
outputs:
  krav:
    description: det installerade trädet med hashar, som pip-audit granskar
    value: ${{ runner.temp }}/krav.txt
runs:
  using: composite
  steps:
    # uv läser bara låsfilen; pip installerar och prövar hasharna. Cachen är
    # av, så att inget från en tidigare körning följer med.
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: "0.13.9"
        enable-cache: false
    # --locked faller om uv.lock inte stämmer med pyproject.toml. Bara hjul,
    # så att inget byggs med byggberoenden utanför låsfilen.
    - shell: bash
      env:
        UTVECKLING: ${{ inputs.utveckling }}
      run: |
        extra=()
        [ "$UTVECKLING" = true ] && extra=(--extra utveckling)
        uv export --locked --no-emit-project --group bygg "${extra[@]}" \
          -o "$RUNNER_TEMP/krav.txt"
        pip install --require-hashes --no-deps --only-binary :all: \
          -r "$RUNNER_TEMP/krav.txt"
        pip install --no-deps --no-build-isolation -e .
