# Projektets Python-beroenden i de versioner och med de hashar som står i
# uv.lock, också beroendenas egna beroenden (K94, ADR-0117).
name: Låsta beroenden
description: Installerar uv.lock med pip --require-hashes och paketet utan beroenden.
inputs:
  flaggor:
    description: extra flaggor till uv export, till exempel --extra utveckling
    default: ""
runs:
  using: composite
  steps:
    # uv läser bara låsfilen; pip installerar och prövar hasharna. Cachen är
    # av, så att inget från en tidigare körning följer med.
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.13.9"
        enable-cache: false
    # --locked faller om uv.lock inte stämmer med pyproject.toml.
    - shell: bash
      env:
        FLAGGOR: ${{ inputs.flaggor }}
      run: |
        read -ra flaggor <<< "$FLAGGOR"
        uv export --locked --no-emit-project --group bygg "${flaggor[@]}" \
          -o "$RUNNER_TEMP/krav.txt"
        pip install --require-hashes --no-deps -r "$RUNNER_TEMP/krav.txt"
        pip install --no-deps --no-build-isolation -e .
