# Det jobbet checkat in, som en git-bundle i en artefakt, och grenens namn
# och bas som output. Körs också när jobbet fallit: varje commit har klarat
# kontrollerna (K11, ADR-0088). Jobbet som läser PDF:erna kan inte pusha;
# det gör PR-jobbet, efter att ha prövat bundlen (K95, ADR-0118).
name: Grenen, om något checkats in
description: Lägger commitarna sedan BAS i artefakten gren-DEL.
outputs:
  gren:
    description: grenen, tom när inget checkats in
    value: ${{ steps.grenen.outputs.gren }}
  bas:
    description: commiten som bundlen bygger på
    value: ${{ steps.grenen.outputs.bas }}
runs:
  using: composite
  steps:
    - id: grenen
      shell: bash
      run: |
        if [ "$(git rev-parse HEAD)" = "$BAS" ]; then
          echo "Inget nytt i poolen." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        git bundle create "$RUNNER_TEMP/gren.bundle" HEAD "^$BAS"
        { echo "gren=$GREN"; echo "bas=$BAS"; } >> "$GITHUB_OUTPUT"
    - if: steps.grenen.outputs.gren != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: gren-${{ env.DEL }}
        path: ${{ runner.temp }}/gren.bundle
        if-no-files-found: error
