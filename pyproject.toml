[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kommunhandlingar"
version = "0.17.0"
requires-python = ">=3.12"
# Konverteringen (ADR-0005, ADR-0014). pdfminer.six och Pillow används också
# direkt och låses därför här, på de versioner pdfplumber drar in.
dependencies = [
  "pdfplumber==0.11.10",
  "pdfminer.six==20260107",
  "pypdfium2==5.15.0",
  "pillow==13.0.0",
  # Webbplatsen renderar dokumenten (ADR-0023); testerna prövar texten (ADR-0021).
  "markdown-it-py==4.2.0",
  # Väg H på skannade sidor (ADR-0105, ADR-0106): RapidOCR med modellerna i
  # onnxruntime.
  "rapidocr==3.10.0",
  "onnxruntime==1.32.0",
]

[project.optional-dependencies]
# Samma versioner i CI och lokalt; Dependabot håller dem uppdaterade.
utveckling = ["ruff==0.17.6", "pip-audit==2.10.1", "coverage==7.17.4"]

# Paketet byggs utan isolering, med setuptools ur låsfilen (ADR-0117);
# golvet i [build-system] gäller bara ett bygge med isolering.
[dependency-groups]
bygg = ["setuptools==84.2.1"]

# Webbplatsens skript och stilar följer med paketet, så att ett datarepo som
# installerar en fast version kan bygga sidorna (ADR-0080).
[tool.setuptools.package-data]
"kommunhandlingar.webbplats" = ["*.js", "*.css"]
# Vad varje version kan ändra följer med koden (ADR-0107).
"kommunhandlingar" = ["omkonvertering.toml"]

# Täckningen i CI (K75, ADR-0102).
[tool.coverage.run]
branch = true
source = ["src/kommunhandlingar", "scripts"]
concurrency = ["multiprocessing"]

[tool.coverage.report]
fail_under = 96

[tool.ruff.lint]
# Vanliga felkontroller plus målen i "Ren kod – strikt" i AGENTS.md, som
# koden håller (K87, ADR-0108); testerna har sina gränser i tests/ruff.toml.
# Rader per funktion och fil kontrolleras av scripts/kontrollera_storlek.py.
preview = true
explicit-preview-rules = true
select = [
  "E", "F", "W", "I", "B", "UP", "SIM",
  "C90",      # cyklomatisk komplexitet
  "PLR0913",  # parametrar
  "PLR1702",  # nästlingsnivåer (preview)
  "ERA",      # bortkommenterad kod
]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
max-args = 3
max-nested-blocks = 2
